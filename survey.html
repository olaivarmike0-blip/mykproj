<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 26th Birthday Brobro!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #ffffff;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 10;
            animation: fadeIn 1.5s ease-in-out;
        }

        .age-badge {
            background: #ff4757;
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 0.5rem 1.2rem;
            border-radius: 50px;
            display: inline-block;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            animation: pulse 2s infinite;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ff9a9e, #fecfef, #a1c4fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 2rem;
        }

        .btn {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* Confetti Elements */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #fff;
            top: -10px;
            border-radius: 3px;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="age-badge">Mary Eloisiest 26th Birthday 🎉</div>
        <h1>Happy Birthday,<br>Brobro!</h1>
        <p>Wishing you an incredible, wonderful, and unforgettable 26th year full of success, good health, great vibes, and endless adventures. Congrats Brobro, Level 26 naka wahahahahaha!</p>
        <button class="btn" onclick="createConfettiBurst()">Celebrate! 🥳</button>
    </div>

    <script>
        // Generate continuous background confetti
        function createConfetti() {
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#eccc68']
            const confettiCount = 30

            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div')
                confetti.classList.add('confetti')
                confetti.style.left = Math.random() * 100 + 'vw'
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)]
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's'
                confetti.style.opacity = Math.random()
                confetti.style.width = (Math.random() * 8 + 5) + 'px'
                confetti.style.height = confetti.style.width
                document.body.appendChild(confetti)
            }
        }

        // Extra burst effect when clicking the button
        function createConfettiBurst() {
            const colors = ['#ff4757', '#2ed573', '#1e90ff', '#ffa502', '#eccc68', '#ffffff']
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div')
                confetti.classList.add('confetti')
                confetti.style.left = Math.random() * 100 + 'vw'
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)]
                confetti.style.animationDuration = (Math.random() * 1.5 + 1) + 's'
                confetti.style.width = (Math.random() * 10 + 6) + 'px'
                confetti.style.height = confetti.style.width
                document.body.appendChild(confetti)

                setTimeout(() => {
                    confetti.remove()
                }, 2500)
            }
        }

        createConfetti()
    </script>
</body>
</html>
